# 1. إعداد بيئة جافا (مطلوب لـ Gradle و Android SDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. قبول التراخيص والتأكد من حزم SDK عبر الأدوات المدمجة في الخادم
      - name: Accept Android Licenses & Ensure Build-Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 3. إعطاء تصريح التشغيل وبناء التطبيق
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease || ./gradlew assembleDebug
